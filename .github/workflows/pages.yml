name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure JetBrainsMonoNL Nerd Font Mono
        run: |
          set -euo pipefail
          if [ ! -f fonts/JetBrainsMonoNLNerdFontMono-Regular.woff2 ]; then
            pip install fonttools brotli
            mkdir -p fonts /tmp/jbnf
            curl -fsSL -o /tmp/jbnf/JetBrainsMono.zip \
              https://github.com/ryanoasis/nerd-fonts/releases/download/v3.4.0/JetBrainsMono.zip
            python3 - <<'PY'
          import zipfile
          from pathlib import Path
          from fontTools.subset import main as subset
          z = zipfile.ZipFile("/tmp/jbnf/JetBrainsMono.zip")
          out = Path("fonts")
          unicodes = "U+0000-00FF,U+0100-024F,U+2000-206F,U+2070-209F,U+20A0-20CF,U+2100-214F,U+2190-21FF,U+2200-22FF,U+2300-23FF,U+2500-259F,U+25A0-25FF,U+2600-26FF,U+2700-27BF,U+2B00-2BFF,U+E000-E0FF,U+F000-F2FF,U+F400-F4FF,U+F500-F8FF"
          for face in ("Regular", "Medium", "Bold", "Italic", "BoldItalic"):
              name = f"JetBrainsMonoNLNerdFontMono-{face}.ttf"
              raw = Path(f"/tmp/jbnf/{name}")
              raw.write_bytes(z.read(name))
              subset([
                  str(raw),
                  f"--output-file=fonts/JetBrainsMonoNLNerdFontMono-{face}.woff2",
                  "--flavor=woff2",
                  "--layout-features=*",
                  f"--unicodes={unicodes}",
                  "--no-hinting",
                  "--desubroutinize",
              ])
          print("fonts ready", list(out.iterdir()))
          PY
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
